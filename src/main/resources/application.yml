server:
  port: 8085 

spring:
  application:
    name: gateway-service
  
  cloud:
    gateway:
    
      globalcors:
        cors-configurations:
          '[/**]': 
            allowedOrigins: "*" 
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      
      routes:
     
        - id: order-management-service-route
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/order-management/**
          filters:
            - StripPrefix=2
            - AddRequestHeader=X-Layer, Process-API

     
        - id: customer-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/customers/**
          filters:
            - StripPrefix=2
            - AddRequestHeader=X-Layer, System-API

     
        - id: order-service-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - StripPrefix=2
            - AddRequestHeader=X-Layer, System-API

management:
  endpoints:
    web:
      exposure:
        include: gateway, health, info